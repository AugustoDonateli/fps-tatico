<text x="12" y="720" font-size="11" fill="#222">1  Tirolesa: torre no penhasco até o terraço do telhado (rápida, exposta, cabo faz barulho)</text><text x="12" y="736" font-size="11" fill="#222">2  Porta da frente no nível da rua, trancada (lockpick com clique; escopeta abre madeira)</text><text x="12" y="752" font-size="11" fill="#222">3  Garagem: portão basculante (barulho alto), porta lateral trancada, portão emperrado (passa deitado)</text><text x="12" y="768" font-size="11" fill="#222">4  Tubulação de drenagem na praia, rastejando até a casa de máquinas no porão</text><text x="12" y="784" font-size="11" fill="#222">5  Duto da casa de máquinas até o forro da lavanderia</text><text x="12" y="800" font-size="11" fill="#222">6  Vão embaixo do deque da piscina até o alçapão da despensa</text><text x="12" y="816" font-size="11" fill="#222">7  Escada de marinheiro escondida no núcleo B (lado do penhasco) até o telhado; claraboia quebra (barulho)</text><text x="12" y="832" font-size="11" fill="#222">8  Trilha estreita no penhasco até a varanda de baixo</text><text x="12" y="848" font-size="11" fill="#222">9  Pelo mar: nadar até o píer e entrar pela porta de vidro da sala</text><text x="12" y="864" font-size="11" fill="#222">10 Janela basculante do banheiro (só agachado, silenciosa)</text><text x="12" y="880" font-size="11" fill="#222">Quadrados amarelos = maletas: escritório (andar de cima), adega (porão −11), garagem (nível da rua)</text><text x="12" y="896" font-size="11" fill="#222">Linha tracejada vermelha = porão e tubulação de drenagem. Linha preta tracejada = cabo da tirolesa</text></svg>